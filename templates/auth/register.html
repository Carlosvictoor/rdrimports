{% extends "base.html" %}
{% block title %}Cadastro — RDR Imports{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">RDR <span>Imports</span></div>
    <h2>Criar conta</h2>
    <form method="post" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-group">
        <label>Nome completo *</label>
        <input type="text" name="name" required />
      </div>
      <div class="form-group">
        <label>E-mail *</label>
        <input type="email" name="email" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Telefone / WhatsApp</label>
        <input type="tel" name="phone" placeholder="(00) 00000-0000" />
      </div>
      <div class="form-group">
        <label>Senha *</label>
        <input type="password" name="password" required minlength="6" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label>Confirmar senha *</label>
        <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-gold btn-full">Criar Conta</button>
    </form>
    <p class="auth-link">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
  </div>
</div>
{% endblock %}
