{% extends "base.html" %}
{% block title %}Página não encontrada — RDR Imports{% endblock %}
{% block content %}
<div style="min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 2rem;">
  <h1 style="font-size:6rem;color:var(--gold);margin:0;line-height:1;">404</h1>
  <h2 style="color:var(--white);margin:.5rem 0 1rem;">Página não encontrada</h2>
  <p style="color:var(--gray);max-width:400px;">O endereço que você acessou não existe ou foi removido.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-gold" style="margin-top:1.5rem;">Voltar ao início</a>

{% endblock %}
